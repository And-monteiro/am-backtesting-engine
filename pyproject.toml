[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "am-backtesting-engine"
version = "0.1.0"
description = "Deterministic synchronous spot backtesting with sealed holdouts"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5", "pandas==3.0.1", "pydantic==2.13.5",
  "fastapi==0.142.2", "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[project.scripts]
am-backtest = "am_backtesting.cli:main"

[tool.setuptools.packages.find]
include = ["am_backtesting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
